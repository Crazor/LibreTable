[workspace]
resolver = "3"
members = [
    "crates/game-core",
    "crates/conformance",
    "crates/l10n",
    "crates/bots",
    "crates/session",
    "crates/registry",
    "crates/cli",
    "crates/server",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
# Default for every crate except `server`, which must override it with
# AGPL-3.0-or-later (ADR-0002).
license = "MPL-2.0"
publish = false
