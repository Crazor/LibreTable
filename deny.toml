# cargo-deny configuration. Licence policy follows docs/adr/0002-licences.md:
# dependencies must be compatible with distributing our crates under MPL-2.0
# (including through the App Store), so GPL-family licences are not allowed.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.93
# The allow list is policy, not an inventory of current dependencies.
unused-allowed-license = "allow"
# Permissive and weak-copyleft licences compatible with MPL-2.0 and AGPL-3.0.
# Add a licence here only after checking it against ADR-0002.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "MPL-2.0",
]
# The `server` crate will be AGPL-3.0-or-later (ADR-0002). When it is added,
# allow that licence for it alone here:
# exceptions = [{ crate = "libretable-server", allow = ["AGPL-3.0-or-later"] }]

[licenses.private]
# Our own unpublished crates are still checked against the allow list.
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
