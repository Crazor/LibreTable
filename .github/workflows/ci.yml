name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The workspace build enables game-core's `dev` feature through
      # conformance's dev-dependency; check game-core without it as well.
      - run: cargo clippy -p libretable-game-core --all-targets --locked -- -D warnings
      # The server's `dev` feature gates the omniscient view; check both.
      - run: cargo clippy -p libretable-server --all-targets --locked -- -D warnings
      - run: cargo clippy -p libretable-server --all-targets --locked --features dev -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-targets --locked
      - run: cargo test --workspace --doc --locked
      # Without the `dev` feature (see the clippy job).
      - run: cargo test -p libretable-game-core --all-targets --locked
      # The server with and without its `dev` feature (tests/dev_gate.rs).
      - run: cargo test -p libretable-server --all-targets --locked
      - run: cargo test -p libretable-server --all-targets --locked --features dev

  l10n:
    name: localization catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Fails on a key in `en` missing from `de` (or the reverse), a file in
      # /locales that is not embedded, and a message ID declared by code
      # without an `en` message (docs/design/localization.md). Also part of
      # the workspace tests; run separately so the failure is easy to spot.
      - run: cargo test -p libretable-l10n --all-targets --locked

  msrv:
    name: minimum Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --locked
      - run: cargo check -p libretable-server --all-targets --locked --features dev

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: scripts/check-dco.sh "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
