[package]
name = "libretable-game-core"
description = "Game trait, table model, selection protocol, RNG and records"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1.0.219", default-features = false, features = ["alloc", "derive"] }

[dev-dependencies]
serde_json = { version = "1.0.140", default-features = false, features = ["alloc"] }

[features]
# Enables `Observer::Omniscient`. Local development builds and tests only;
# a non-dev server never enables it.
dev = []
