[package]
name = "libretable-mau-mau"
description = "Mau-Mau, the shedding card game (docs/games/mau-mau/rules.md)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
libretable-cards = { path = "../../cards" }
libretable-game-core = { path = "../../game-core" }
serde = { version = "1.0.219", default-features = false, features = ["alloc", "derive"] }

[dev-dependencies]
libretable-conformance = { path = "../../conformance" }
# Tests need `Observer::Omniscient`; dev-dependency features apply to test
# builds only.
libretable-game-core = { path = "../../game-core", features = ["dev"] }
serde_json = { version = "1.0.140", default-features = false, features = ["alloc"] }
